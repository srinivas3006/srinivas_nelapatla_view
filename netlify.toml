# Netlify build. vite.config.ts switches nitro to its `netlify` preset when
# NETLIFY=true (set automatically on Netlify): static files go to dist/, the
# SSR server to .netlify/functions-internal/ (picked up automatically).
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Node 24+: nitro's file tracer (nf3) imports named exports from a CommonJS
  # module, which fails on Node 22 ("Named export 'nodeFileTrace' not found").
  NODE_VERSION = "24"
  NPM_FLAGS = "--no-audit --no-fund"

# Required environment variables (Site configuration → Environment variables):
#   SUPABASE_URL               https://<project>.supabase.co
#   SUPABASE_SERVICE_ROLE_KEY  server-only; never prefix with VITE_
#   ADMIN_PASSWORD             password for /admin
